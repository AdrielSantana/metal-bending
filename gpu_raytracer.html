<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fly: ray tracer (Bend on WebGPU)</title>
<style>.note{color:#7a8798;font-size:13px;margin:8px;max-width:760px}body{margin:0;background:#0b0e14;color:#c9d4e3;font:14px ui-monospace,Menlo,monospace}canvas{display:block}pre{margin:8px;white-space:pre-wrap;word-break:break-all}a{color:#59e3ff}select{font:inherit;color:inherit;background:#222;border:1px solid #444}</style></head>
<body><canvas id="bend" tabindex="0"></canvas><pre>on <select id="bend-threads"></select>, <span id="bend-fps">starting on the GPU…</span></pre><!-- mode selector -->
<script>
  // the same selector as the CPU page: the threads entries go back to it
  var select = document.getElementById("bend-threads"), cores = navigator.hardwareConcurrency;
  select.appendChild(new Option("WebGPU", "gpu"));
  for (var i = 1; i <= cores; i += 1) select.appendChild(new Option(i + (i == 1 ? " thread" : " threads"), i));
  select.onchange = function() { if (select.value != "gpu") location.href = (new URLSearchParams(location.search).get("res") == "512" ? "raytracer_512.html" : "app_ray_tracer_3d.html") + "?threads=" + select.value; };
</script><pre id="bend-out"></pre>
<p class="note">The upstream ray tracer at 1024×768 on WebGPU: W/A/S/D fly, Q/E up/down, arrows turn and look; the corner shows the frames per second, as in the original. The CPU page does 19 fps on ten cores at this size. <code>?res=512</code> for 512×384. Numbers and the how on the <a href="index.html">index</a>.</p>
<script type="module">
import { page } from "./page.js";
// demos/app_ray_tracer_3d/main.bend: Fly.scene!(d, 0, 0, cam); the host side (keys, Fly.step, Fly.camera) in JS
const q = new URLSearchParams(location.search), big = q.get("res") !== "512";
const K = big ? 10 : 9, W = big ? 1024 : 512, HH = big ? 768 : 384, CX = big ? 511.5 : 255.5, CY = big ? 383.5 : 191.5, FL = big ? 640.0 : 320.0;
const WGSL = `
fn root_args() -> array<vec2<u32>, 3> { for (var i = 0u; i < 12u; i++) { st(8u + i, imm(uv(i))); } return array<vec2<u32>, 3>(imm(0u), imm(0u), mk(TAG_CTR, 0u, 8u)); }
fn kid_s(j: u32, s: vec2<u32>) -> vec2<u32> { return s; }
fn kid(i: u32, j: u32, x: vec2<u32>, y: vec2<u32>, s: vec2<u32>) -> array<vec2<u32>, 2> {
  let h = 1u << j; return array<vec2<u32>, 2>(imm(x.x + select(0u, h, (i & 1u) == 1u)), imm(y.x + select(0u, h, i >= 2u)));
}
fn clamp01(x: f32) -> f32 { return min(1.0, max(0.0, x)); }
fn sdf(px: f32, py: f32, pz: f32) -> f32 {
  let qx = px - 4.0 * floor(px / 4.0) - 2.0; let qz = pz - 4.0 * floor(pz / 4.0) - 2.0; let qy = py - 1.0;
  return min(py, sqrt(qx * qx + qy * qy + qz * qz) - 1.0);
}
fn march(n: u32, ox: f32, oy: f32, oz: f32, dx: f32, dy: f32, dz: f32, t0: f32) -> f32 {
  var t = t0;
  for (var i = 0u; i < n; i++) { let d = sdf(ox + t * dx, oy + t * dy, oz + t * dz); t = t + d; if (d < 0.002 || t > 60.0) { break; } }
  return t;
}
fn pack(r: f32, g: f32, bb: f32) -> u32 { return (u32(255.0 * clamp01(r)) << 16u) | (u32(255.0 * clamp01(g)) << 8u) | u32(255.0 * clamp01(bb)); }
fn sky(dy: f32) -> u32 { let u = clamp01(dy * 2.0); return pack(0.75 - 0.45 * u, 0.85 - 0.35 * u, 1.0); }
fn checker(px: f32, pz: f32) -> f32 { let c = floor(px) + floor(pz); return select(0.35, 0.9, (c - 2.0 * floor(c * 0.5)) == 0.0); }
fn surface(px: f32, py: f32, pz: f32, nx: f32, ny: f32, nz: f32, t: f32) -> u32 {
  let diffuse = max(0.0, nx * 0.4082 + ny * 0.8165 - nz * 0.4082);
  let shade = march(48u, px + nx * 0.02, py + ny * 0.02, pz + nz * 0.02, 0.4082, 0.8165, 0.0 - 0.4082, 0.05);
  let light = select(0.15 + 0.85 * diffuse, 0.15, shade < 60.0);
  let fog = clamp01(t * 0.03);
  let ground = py < 0.02; let ch = checker(px, pz);
  let r = select(0.9, ch, ground); let g = select(0.4, ch, ground); let bb = select(0.3, ch, ground);
  return pack(r * light + (0.75 - r * light) * fog, g * light + (0.85 - g * light) * fog, bb * light + (1.0 - bb * light) * fog);
}
fn ray(ox: f32, oy: f32, oz: f32, dx: f32, dy: f32, dz: f32) -> u32 {
  let t = march(96u, ox, oy, oz, dx, dy, dz, 0.0);
  if (t > 60.0) { return sky(dy); }
  let px = ox + t * dx; let py = oy + t * dy; let pz = oz + t * dz;
  let nx = sdf(px + 0.001, py, pz) - sdf(px - 0.001, py, pz);
  let ny = sdf(px, py + 0.001, pz) - sdf(px, py - 0.001, pz);
  let nz = sdf(px, py, pz + 0.001) - sdf(px, py, pz - 0.001);
  let il = 1.0 / sqrt(nx * nx + ny * ny + nz * nz);
  return surface(px, py, pz, nx * il, ny * il, nz * il, t);
}
fn cast_ray(x: u32, y: u32, cam: u32) -> u32 {
  let ex = f(ld(cam).x); let ey = f(ld(cam + 1u).x); let ez = f(ld(cam + 2u).x);
  let fx = f(ld(cam + 3u).x); let fy = f(ld(cam + 4u).x); let fz = f(ld(cam + 5u).x);
  let rx = f(ld(cam + 6u).x); let rz = f(ld(cam + 7u).x);
  let ux = f(ld(cam + 8u).x); let uy = f(ld(cam + 9u).x); let uz = f(ld(cam + 10u).x);
  let sx = (f32(x) - ${CX}) / ${FL}; let sy = (${CY} - f32(y)) / ${FL};
  let vx = fx + sx * rx + sy * ux; let vy = fy + sy * uy; let vz = fz + sx * rz + sy * uz;
  let il = 1.0 / sqrt(vx * vx + vy * vy + vz * vz);
  return ray(ex, ey, ez, vx * il, vy * il, vz * il);
}
fn glyph(dd: u32) -> u32 { switch dd { case 0u: { return 480599u; } case 1u: { return 467506u; } case 2u: { return 464711u; } case 3u: { return 476999u; } case 4u: { return 280405u; } case 5u: { return 476951u; } case 6u: { return 481047u; } case 7u: { return 279623u; } case 8u: { return 481111u; } case 9u: { return 477015u; } default: { return 0u; } } }
fn digit(i: u32, fps: u32) -> u32 { if (i == 0u) { return select(fps / 100u, 10u, fps < 100u); } if (i == 1u) { return select(fps / 10u % 10u, 10u, fps < 10u); } return fps % 10u; }
fn hud(x: u32, y: u32, fps: u32) -> u32 { let bit = y / 8u * 4u + x % 32u / 8u; return 16777215u * ((glyph(digit(x / 32u, fps)) >> bit) & 1u); }
fn leaf(x: vec2<u32>, y: vec2<u32>, s: vec2<u32>) -> vec2<u32> {
  let cam = s.x; var c: u32;
  if (x.x < 96u && y.x < 40u) { c = hud(x.x, y.x, ld(cam + 11u).x); } else { c = cast_ray(x.x, y.x, cam); }
  let l = alloc(1u); st(l, imm(c)); return mk(TAG_CTR, CID_PIX, l);
}`;
// host side
const S = { x: 0, y: 1.5, z: -6, yaw: 0, pitch: 0, held: new Set(), fps: 0 };
const slots = { KeyW: 0, KeyA: 1, KeyS: 2, KeyD: 3, KeyQ: 4, KeyE: 5, ArrowLeft: 6, ArrowRight: 7, ArrowUp: 8, ArrowDown: 9 };
window.addEventListener("keydown", (e) => { if (e.code in slots) { S.held.add(slots[e.code]); e.preventDefault(); } });
window.addEventListener("keyup", (e) => { if (e.code in slots) { S.held.delete(slots[e.code]); e.preventDefault(); } });
const held = (k) => S.held.has(k) ? 1 : 0;
function step() { const fwd = held(0) - held(2), side = held(3) - held(1), rise = held(4) - held(5), turn = held(7) - held(6), tilt = held(8) - held(9);
  const yaw2 = S.yaw + 0.03 * turn; S.x += 0.08 * (fwd * Math.sin(yaw2) + side * Math.cos(yaw2)); S.y = Math.max(0.3, S.y + 0.08 * rise); S.z += 0.08 * (fwd * Math.cos(yaw2) - side * Math.sin(yaw2)); S.yaw = yaw2; S.pitch = Math.min(1.4, Math.max(-1.4, S.pitch + 0.02 * tilt)); }
function camera(s) { const sy = Math.sin(s.yaw), cy = Math.cos(s.yaw), sp = Math.sin(s.pitch), cp = Math.cos(s.pitch); return [s.x, s.y, s.z, sy * cp, sp, cy * cp, cy, -sy, -sp * sy, cp, -sp * cy]; }
const words = (cam, fps) => { const w = new Uint32Array(16), fv = new Float32Array(w.buffer); fv.set(cam); w[11] = fps; return w; };
// JS reference of the pixel, doubles
const clamp01 = (x) => Math.min(1, Math.max(0, x)), sdf = (px, py, pz) => { const qx = px - 4 * Math.floor(px / 4) - 2, qz = pz - 4 * Math.floor(pz / 4) - 2, qy = py - 1; return Math.min(py, Math.hypot(qx, qy, qz) - 1); };
function march(n, ox, oy, oz, dx, dy, dz, t) { for (let i = 0; i < n; i++) { const d = sdf(ox + t * dx, oy + t * dy, oz + t * dz); t += d; if (d < 0.002 || t > 60) break; } return t; }
const pack = (r, g, b) => (Math.trunc(255 * clamp01(r)) << 16) | (Math.trunc(255 * clamp01(g)) << 8) | Math.trunc(255 * clamp01(b));
const sky = (dy) => { const u = clamp01(dy * 2); return pack(0.75 - 0.45 * u, 0.85 - 0.35 * u, 1); };
const checker = (px, pz) => { const c = Math.floor(px) + Math.floor(pz); return c - 2 * Math.floor(c * 0.5) === 0 ? 0.9 : 0.35; };
function ray(ox, oy, oz, dx, dy, dz) { const t = march(96, ox, oy, oz, dx, dy, dz, 0); if (t > 60) return sky(dy);
  const px = ox + t * dx, py = oy + t * dy, pz = oz + t * dz, nx = sdf(px + 0.001, py, pz) - sdf(px - 0.001, py, pz), ny = sdf(px, py + 0.001, pz) - sdf(px, py - 0.001, pz), nz = sdf(px, py, pz + 0.001) - sdf(px, py, pz - 0.001), il = 1 / Math.hypot(nx, ny, nz);
  const NX = nx * il, NY = ny * il, NZ = nz * il, diffuse = Math.max(0, NX * 0.4082 + NY * 0.8165 - NZ * 0.4082), shade = march(48, px + NX * 0.02, py + NY * 0.02, pz + NZ * 0.02, 0.4082, 0.8165, -0.4082, 0.05);
  const light = shade < 60 ? 0.15 : 0.15 + 0.85 * diffuse, fog = clamp01(t * 0.03), ground = py < 0.02, ch = checker(px, pz), r = ground ? ch : 0.9, g = ground ? ch : 0.4, b = ground ? ch : 0.3;
  return pack(r * light + (0.75 - r * light) * fog, g * light + (0.85 - g * light) * fog, b * light + (1 - b * light) * fog); }
function ref(x, y, w) { const c = new Float32Array(w.buffer); if (x < 96 && y < 40) { const fps = w[11], i = Math.floor(x / 32), dgt = i === 0 ? (fps < 100 ? 10 : Math.floor(fps / 100)) : i === 1 ? (fps < 10 ? 10 : Math.floor(fps / 10) % 10) : fps % 10;
    const G = [480599, 467506, 464711, 476999, 280405, 476951, 481047, 279623, 481111, 477015, 0][dgt], bit = Math.floor(y / 8) * 4 + Math.floor(x % 32 / 8); return 16777215 * ((G >> bit) & 1); }
  const sx = (x - CX) / FL, sy = (CY - y) / FL, vx = c[3] + sx * c[6] + sy * c[8], vy = c[4] + sy * c[9], vz = c[5] + sx * c[7] + sy * c[10], il = 1 / Math.hypot(vx, vy, vz);
  return ray(c[0], c[1], c[2], vx * il, vy * il, vz * il); }
page({ name: "fly", K, W, H: HH, G: 7, leafSlots: 1, heap0: 24, wgsl: WGSL,
  frames: (i) => words(camera({ ...S, yaw: 0.002 * i }), 42),
  live: () => { step(); return words(camera(S), S.fps); },
  onStats: (s) => { S.fps = s.fps; },
  ref });
document.getElementById("bend").focus();
</script></body></html>
